<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>RandStuff</title>
  <style>
    :root {
      --bg: #5e5e5e;
      --panel: #4d4d4d;
      --text: #f1efe9;
      --muted: #c9c5bc;
      --btn-top: #ffd23a;
      --btn-bottom: #ff9900;
      --btn-text: #5a2d00;
      --error: #ffb4a6;
      --ok: #c8f0a8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 320px;
      padding: 16px;
      font: 14px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--text);
      background:
              repeating-linear-gradient(45deg, rgba(255,255,255,.03) 0 2px, transparent 2px 4px),
              var(--bg);
    }
    h1 { margin: 0 0 4px; font-size: 20px; font-weight: 400; }
    p.hint { margin: 0 0 12px; color: var(--muted); font-size: 12.5px; }
    .editor {
      display: flex;
      border: 1px solid #3c3c3c;
      border-radius: 4px;
      background: var(--panel);
    }
    .editor:focus-within { outline: 2px solid var(--btn-top); outline-offset: 2px; }
    .editor textarea { font: 15px/1.6 Consolas, "Courier New", monospace; }
    /* Номера абсолютно, чтобы не растягивать поле */
    .gutter {
      flex: none; width: 32px; position: relative;
      overflow: hidden; user-select: none;
      border-right: 1px solid #454545;
    }
    #gutterLines {
      position: absolute; top: 0; left: 0; right: 6px;
      padding-top: 8px; text-align: right;
      color: #7c7c7c; font: 12px/24px Consolas, "Courier New", monospace; /* 24px = 15px × 1.6, в шаг со строками */
    }
    #hints { margin: -4px 0 8px; font-size: 12.5px; color: var(--btn-top); white-space: pre-line; }
    #hints:empty { display: none; }
    #gutterLines .cur { color: var(--btn-top); }
    #gutterLines .err { color: var(--error); font-weight: 700; }
    textarea {
      flex: 1; min-width: 0;
      height: 160px; /* без ручки растягивания: она укорачивала полосу прокрутки */
      resize: none;
      padding: 8px 10px;
      border: 0;
      border-radius: 0 4px 4px 0;
      background: transparent;
      color: var(--text);
      white-space: pre;
      outline: none;
    }
    textarea { scrollbar-color: #7a7a7a var(--panel); }
    textarea::-webkit-scrollbar { width: 10px; }
    textarea::-webkit-scrollbar-track { background: var(--panel); border-radius: 0 4px 4px 0; }
    textarea::-webkit-scrollbar-thumb { background: #6e6e6e; border-radius: 5px; border: 2px solid var(--panel); }
    textarea::-webkit-scrollbar-thumb:hover { background: #858585; }
    textarea::-webkit-scrollbar-corner { background: var(--panel); }
    button:focus-visible, input:focus-visible {
      outline: 2px solid var(--btn-top);
      outline-offset: 2px;
    }
    .controls {
      display: grid; grid-template-columns: 1fr 128px; align-items: center;
      gap: 10px 10px; margin-top: 12px; font-size: 13px;
    }
    .controls label { white-space: nowrap; }
    label.toggle { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    label.toggle input { margin: 0; }
    .controls .field {
      justify-self: stretch; text-align: center;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .save {
      width: 100%;
      margin-top: 12px;
      padding: 9px 0;
      border: 1px solid #c27000;
      border-radius: 6px;
      background: linear-gradient(var(--btn-top), var(--btn-bottom));
      color: var(--btn-text);
      font: italic 700 18px/1 Georgia, "Times New Roman", serif;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 2px 0 #a85f00;
    }
    .save:active { transform: translateY(1px); box-shadow: inset 0 1px 0 rgba(255,255,255,.5); }
    #status { min-height: 1.4em; margin-top: 8px; font-size: 12.5px; }
    #status.ok { color: var(--ok); }
    #status.err { color: var(--error); white-space: pre-line; }
    #next { margin-top: 8px; font-size: 12.5px; color: var(--muted); }
    #next b { color: var(--text); font-weight: 600; }
    .field {
      padding: 4px 6px;
      border: 1px solid #3c3c3c; border-radius: 4px;
      background: var(--panel); color: var(--text);
      font: 13px/1.2 "Segoe UI", system-ui, sans-serif; cursor: pointer;
    }
    .field:hover { background: #454545; }
    #hotkeyField { font-weight: 600; }
    #hotkeyField.recording { border-color: var(--btn-top); color: var(--btn-top); font-weight: 400; }
    .count { display: flex; align-items: center; gap: 6px; margin: 10px 0 8px; }
    .count label { margin-right: 2px; }
    .count input {
      width: 52px; padding: 4px 2px; text-align: center;
      border: 1px solid #3c3c3c; border-radius: 4px;
      background: var(--panel); color: var(--text);
      font: 600 16px/1.2 "Segoe UI", system-ui, sans-serif;
      -moz-appearance: textfield;
    }
    .count input::-webkit-outer-spin-button,
    .count input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .step {
      width: 26px; height: 26px; padding: 0;
      border: 1px solid #3c3c3c; border-radius: 4px;
      background: var(--panel); color: var(--text); font-size: 16px; line-height: 1; cursor: pointer;
    }
    .step:hover { background: #454545; }
  </style>
</head>
<body>
<h1>Какие числа выпадут</h1>
<div class="count">
  <label for="count">Генерировать</label>
  <button type="button" class="step" id="minus" aria-label="Меньше">−</button>
  <input type="number" id="count" min="1" max="50" step="1" inputmode="numeric">
  <button type="button" class="step" id="plus" aria-label="Больше">+</button>
  <span id="countWord">чисел</span>
</div>
<div id="hints" role="status"></div>

<p class="hint">Одна строка — одно нажатие «Сгенерировать». Числа в строке через пробел или запятую, <b>?</b> — случайное число.</p>

<div class="editor">
  <div class="gutter" aria-hidden="true"><div id="gutterLines"></div></div>
  <textarea id="seq" spellcheck="false" wrap="off" aria-label="Последовательности"></textarea>
</div>

<div class="controls">
  <label class="toggle"><input type="checkbox" id="loop"> Повторять по кругу</label>
  <button class="field" id="reset" type="button" title="Следующим нажатием будет первая строка">С первой строки</button>
  <label for="hotkeyField">Вкл/выкл подмены:</label>
  <button type="button" class="field" id="hotkeyField" title="Нажмите, затем введите своё сочетание">—</button>
</div>

<button class="save" id="save" type="button">Сохранить</button>
<div id="status" role="status"></div>
<div id="next"></div>
<script src="shared.js"></script>
<script src="popup.js"></script>
</body>
</html>
